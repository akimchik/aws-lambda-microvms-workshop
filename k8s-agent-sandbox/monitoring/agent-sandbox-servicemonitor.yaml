apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agent-sandbox-controller-monitor
  namespace: agent-sandbox-system
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mogenius-agent-sandbox
  endpoints:
  - port: metrics
    interval: 5s
    path: /metrics
