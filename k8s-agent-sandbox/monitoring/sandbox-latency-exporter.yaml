apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-latency-exporter-code
  namespace: agent-sandbox-system
data:
  exporter.py: |
    #!/usr/bin/env python3
    from http.server import HTTPServer, BaseHTTPRequestHandler
    import urllib.parse
    import json

    state = {
        "warm_sum": 0.0,
        "warm_count": 0,
        "last_latency": 0.0,
        "security_runs": 0,
        "security_checks_passed": 6,
        "vectors": {
            "T1_IMDS_SSRF": 1,
            "T2_K8S_API_LATERAL": 1,
            "T3_INTERNAL_SVC_LATERAL": 1,
            "T4_AMBIENT_CREDENTIALS": 1,
            "T6B_BROKER_POLICY_ENFORCEMENT": 1,
            "T6C_OUT_OF_SANDBOX_AUTH": 1
        }
    }

    class ExporterHandler(BaseHTTPRequestHandler):
        def do_POST(self):
            parsed = urllib.parse.urlparse(self.path)
            if parsed.path == "/record":
                qs = urllib.parse.parse_qs(parsed.query)
                try:
                    if "latency_ms" in qs:
                        lat = float(qs.get("latency_ms", [0])[0])
                        state["warm_sum"] += lat
                        state["warm_count"] += 1
                        state["last_latency"] = lat
                    if "security_passed" in qs:
                        passed = int(qs.get("security_passed", [6])[0])
                        state["security_runs"] += 1
                        state["security_checks_passed"] = passed
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.end_headers()
                    self.wfile.write(json.dumps({"status": "recorded", "state": state}).encode())
                except Exception as e:
                    self.send_response(400)
                    self.end_headers()
                    self.wfile.write(str(e).encode())
                return
            self.send_response(404)
            self.end_headers()

        def do_GET(self):
            parsed = urllib.parse.urlparse(self.path)
            if parsed.path in ["/healthz", "/"]:
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"OK")
                return

            if parsed.path == "/metrics":
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; version=0.0.4")
                self.end_headers()

                out = [
                    "# HELP agent_sandbox_claim_controller_startup_latency_ms Warm Pool Claim-to-Ready latency",
                    "# TYPE agent_sandbox_claim_controller_startup_latency_ms counter",
                    f'agent_sandbox_claim_controller_startup_latency_ms_sum{{launch_type="warm"}} {state["warm_sum"]}',
                    f'agent_sandbox_claim_controller_startup_latency_ms_count{{launch_type="warm"}} {state["warm_count"]}',
                    "# HELP agent_sandbox_claim_latency_last_ms Last measured claim latency in ms",
                    "# TYPE agent_sandbox_claim_latency_last_ms gauge",
                    f'agent_sandbox_claim_latency_last_ms {state["last_latency"]}',
                    "# HELP agent_sandbox_security_audit_runs_total Total automated red-team security probe runs",
                    "# TYPE agent_sandbox_security_audit_runs_total counter",
                    f'agent_sandbox_security_audit_runs_total {state["security_runs"]}',
                    "# HELP agent_sandbox_security_checks_passed Number of critical T1-T6 threat model checks passing",
                    "# TYPE agent_sandbox_security_checks_passed gauge",
                    f'agent_sandbox_security_checks_passed {state["security_checks_passed"]}',
                    "# HELP agent_sandbox_security_vector_status Status of individual threat model vector (1=PASS, 0=FAIL)",
                    "# TYPE agent_sandbox_security_vector_status gauge"
                ]
                for vec, val in state["vectors"].items():
                    out.append(f'agent_sandbox_security_vector_status{{vector="{vec}"}} {val}')

                self.wfile.write(("\n".join(out) + "\n").encode())
                return

            self.send_response(404)
            self.end_headers()

    def run():
        port = 8080
        server = HTTPServer(("0.0.0.0", port), ExporterHandler)
        print(f"Sandbox Latency & Security Exporter listening on port {port}...")
        server.serve_forever()

    if __name__ == "__main__":
        run()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-latency-exporter
  namespace: agent-sandbox-system
  labels:
    app: sandbox-latency-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-latency-exporter
  template:
    metadata:
      labels:
        app: sandbox-latency-exporter
    spec:
      containers:
      - name: exporter
        image: python:3.11-alpine
        command: ["python3", "/app/exporter.py"]
        ports:
        - containerPort: 8080
          name: metrics
        volumeMounts:
        - name: code
          mountPath: /app
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: code
        configMap:
          name: sandbox-latency-exporter-code
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-latency-exporter
  namespace: agent-sandbox-system
  labels:
    app: sandbox-latency-exporter
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: metrics
  selector:
    app: sandbox-latency-exporter
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sandbox-latency-exporter-monitor
  namespace: agent-sandbox-system
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: sandbox-latency-exporter
  endpoints:
  - port: metrics
    path: /metrics
    interval: 5s
