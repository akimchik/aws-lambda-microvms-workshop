apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-router
  namespace: agent-sandbox-system
  labels:
    app: sandbox-router
    app.kubernetes.io/name: sandbox-router
    app.kubernetes.io/instance: sandbox-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-router
  template:
    metadata:
      labels:
        app: sandbox-router
        app.kubernetes.io/name: sandbox-router
        app.kubernetes.io/instance: sandbox-router
    spec:
      containers:
      - name: router
        image: registry.k8s.io/agent-sandbox/sandbox-router-go:v1.0.4
        imagePullPolicy: IfNotPresent
        command: ["/sandbox-router"]
        args:
          - "--http-bind-address=:8080"
          - "--metrics-bind-address=:9090"
          - "--health-probe-bind-address=:8081"
          - "--path-routing-prefix=/sandboxes"
          - "--authz-mode=allow-all"
        ports:
        - name: http
          containerPort: 8080
        - name: metrics
          containerPort: 9090
        - name: probes
          containerPort: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 2
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 1
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-router
  namespace: agent-sandbox-system
  labels:
    app: sandbox-router
    app.kubernetes.io/name: sandbox-router
    app.kubernetes.io/instance: sandbox-router
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: metrics
    port: 9090
    targetPort: 9090
  selector:
    app.kubernetes.io/name: sandbox-router
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sandbox-router-monitor
  namespace: agent-sandbox-system
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-router
  endpoints:
  - port: metrics
    interval: 5s
    path: /metrics
