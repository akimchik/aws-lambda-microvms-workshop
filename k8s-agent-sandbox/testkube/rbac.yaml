apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: testkube-sandbox-admin
rules:
- apiGroups:
  - "extensions.agents.x-k8s.io"
  - "agents.x-k8s.io"
  resources:
  - "sandboxclaims"
  - "sandboxes"
  - "sandboxwarmpools"
  verbs:
  - "*"
- apiGroups:
  - ""
  resources:
  - "pods"
  - "pods/log"
  - "services"
  verbs:
  - "get"
  - "list"
  - "watch"
- apiGroups:
  - ""
  resources:
  - "pods/exec"
  verbs:
  - "create"
  - "get"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: testkube-sandbox-admin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: testkube-sandbox-admin
subjects:
- kind: ServiceAccount
  name: default
  namespace: testkube
- kind: ServiceAccount
  name: testkube-api-server-tests-job
  namespace: testkube
